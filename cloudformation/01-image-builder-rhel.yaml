AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CIS hardening pipeline - RHEL9 Image Builder recipe/pipeline/distribution.
  Deploy 00-shared.yaml first with the same NamePrefix. See ../../docs/architecture.md.

Parameters:
  NamePrefix:
    Type: String
    Default: cis-hardening
    Description: Must match the NamePrefix used when deploying 00-shared.yaml.

  BaseAmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Base RHEL9 AMI ID. Red Hat does not publish a public SSM parameter for
      this, so look one up yourself, e.g.:
      aws ec2 describe-images --owners 309956199498 --filters
      "Name=name,Values=RHEL-9*_HVM-*-x86_64-*-Hourly2-GP3" "Name=architecture,Values=x86_64"
      --query "sort_by(Images,&CreationDate)[-1].ImageId" --output text

  SubnetId:
    Type: AWS::EC2::Subnet::Id

  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>

  InstanceType:
    Type: String
    Default: m5.large

  CisLevel:
    Type: String
    Default: '1'
    AllowedValues: ['1', '2']

  CisProfile:
    Type: String
    Default: server
    AllowedValues: [server, workstation]

  LandingZoneAccountIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Optional AWS account IDs (bare, not ARNs) to grant AMI launch permission to.

  PipelineScheduleExpression:
    Type: String
    Default: cron(0 6 ? * SUN *)

Conditions:
  HasLandingZoneAccounts: !Not [!Equals [!Join [',', !Ref LandingZoneAccountIds], '']]

Resources:
  HardeningComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: !Sub '${NamePrefix}-rhel9-cis-harden'
      Description: Native (no Ansible) CIS RHEL9 hardening - build-time remediate + validate.
      Platform: Linux
      Version: 1.0.0
      Data: !Sub
        - |
          name: RHEL9-CIS-Hardening
          description: >-
            Applies CIS RHEL 9 hardening natively (no Ansible, no external control
            node). Resolves the current hardening-content artifact location from SSM
            Parameter Store at build time - see hardening-content/CONTRACT.md.
          schemaVersion: 1.0
          phases:
            - name: build
              steps:
                - name: InstallPrereqs
                  action: ExecuteBash
                  inputs:
                    commands:
                      - set -e
                      - dnf install -y unzip tar >/dev/null
                - name: DownloadHardeningArtifact
                  action: ExecuteBash
                  inputs:
                    commands:
                      - set -e
                      - S3_URI=$(aws ssm get-parameter --name '${ArtifactParameterName}' --region '${AWS::Region}' --query 'Parameter.Value' --output text)
                      - echo "Resolved hardening artifact:$S3_URI"
                      - mkdir -p /opt/cis-hardening
                      - aws s3 cp "$S3_URI" /opt/cis-hardening/rhel9-cis.tar.gz --region '${AWS::Region}'
                      - tar -xzf /opt/cis-hardening/rhel9-cis.tar.gz -C /opt/cis-hardening
                      - chmod +x /opt/cis-hardening/rhel9-cis/run.sh
                - name: Remediate
                  action: ExecuteBash
                  inputs:
                    commands:
                      - /opt/cis-hardening/rhel9-cis/run.sh --mode remediate --level ${CisLevel} --profile ${CisProfile}
            - name: validate
              steps:
                - name: Audit
                  action: ExecuteBash
                  inputs:
                    commands:
                      - /opt/cis-hardening/rhel9-cis/run.sh --mode audit --level ${CisLevel} --profile ${CisProfile}
        - ArtifactParameterName: !Sub '/${NamePrefix}/artifacts/rhel9/s3-uri'

  ImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Sub '${NamePrefix}-rhel9-cis'
      Version: 1.0.0
      ParentImage: !Ref BaseAmiId
      Components:
        - ComponentArn: !Ref HardeningComponent
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
            KmsKeyId: !ImportValue
              Fn::Sub: '${NamePrefix}-KmsKeyArn'

  InfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: !Sub '${NamePrefix}-rhel9-cis'
      InstanceProfileName: !ImportValue
        Fn::Sub: '${NamePrefix}-ImageBuilderInstanceProfileName'
      InstanceTypes: [!Ref InstanceType]
      SubnetId: !Ref SubnetId
      SecurityGroupIds: !Ref SecurityGroupIds
      TerminateInstanceOnFailure: true
      SnsTopicArn: !ImportValue
        Fn::Sub: '${NamePrefix}-SnsTopicArn'
      # Tag keys must be literal in a CFN Map-type property (no intrinsic
      # functions as map keys) -- these match 00-shared.yaml's
      # TagKeyBenchmark/TagKeyLevel defaults. If you change those defaults
      # there, update the literal keys here to match.
      ResourceTags:
        CISBenchmark: RHEL9
        CISBenchmarkLevel: !Ref CisLevel

  DistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: !Sub '${NamePrefix}-rhel9-cis'
      Distributions:
        - Region: !Ref AWS::Region
          AmiDistributionConfiguration:
            Name: !Sub '${NamePrefix}-rhel9-cis-{{ imagebuilder:buildDate }}'
            KmsKeyId: !ImportValue
              Fn::Sub: '${NamePrefix}-KmsKeyArn'
            AmiTags:
              CISBenchmark: RHEL9
              CISBenchmarkLevel: !Ref CisLevel
            LaunchPermissionConfiguration: !If
              - HasLandingZoneAccounts
              - UserIds: !Ref LandingZoneAccountIds
              - !Ref AWS::NoValue

  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: !Sub '${NamePrefix}-rhel9-cis'
      ImageRecipeArn: !Ref ImageRecipe
      InfrastructureConfigurationArn: !Ref InfrastructureConfiguration
      DistributionConfigurationArn: !Ref DistributionConfiguration
      Status: ENABLED
      Schedule:
        ScheduleExpression: !Ref PipelineScheduleExpression
        PipelineExecutionStartCondition: EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE
      ImageTestsConfiguration:
        ImageTestsEnabled: true
        TimeoutMinutes: 90

  PipelineStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${NamePrefix}-rhel9-cis-pipeline-state'
      EventPattern:
        source: [aws.imagebuilder]
        detail-type: ['EC2 Image Builder Image State Change']
      Targets:
        - Id: sns
          Arn: !ImportValue
            Fn::Sub: '${NamePrefix}-SnsTopicArn'

Outputs:
  PipelineArn:
    Value: !Ref ImagePipeline
  RecipeArn:
    Value: !Ref ImageRecipe
